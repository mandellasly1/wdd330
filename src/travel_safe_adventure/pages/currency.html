<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter - Travel Safe Adventure</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header>
    <h1>💱 Currency Converter</h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="search.html">Search</a>
      <a href="map.html">Map</a>
    </nav>
  </header>

  <main>
    <p>Convert between currencies using live exchange rates.</p>
    <input type="number" id="amount" placeholder="Enter amount" />
    <select id="fromCurrency">
      <option value="USD">USD</option>
      <option value="EUR">EUR</option>
      <option value="GBP">GBP</option>
      <option value="NGN">NGN</option>
    </select>
    <span>to</span>
    <select id="toCurrency">
      <option value="USD">USD</option>
      <option value="EUR">EUR</option>
      <option value="GBP">GBP</option>
      <option value="NGN">NGN</option>
    </select>
    <button id="convertBtn">Convert</button>

    <section id="conversionResult"></section>
  </main>

  <footer>
    <p>&copy; 2026 Travel Safe Adventure</p>
  </footer>

  <script type="module" src="../js/currency.js"></script>
</body>
</html>
